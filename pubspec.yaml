name: tickety
description: "A full-featured event discovery and booking app powered by Ticketmaster."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3+1

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1
  path: ^1.9.1

  # Firebase — enabled in feature/data-auth after flutterfire configure
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.1
  # google_sign_in: ^6.2.1

  # Navigation
  go_router: ^14.2.7

  # Dependency Injection
  get_it: ^8.0.2

  # Images
  cached_network_image: ^3.3.1

  # QR & Barcode — enabled in feature/ui-details-booking
  # qr_flutter: ^4.1.0
  # barcode_widget: ^2.0.4

  # Notifications — enabled in feature/data-auth
  # flutter_local_notifications: ^17.2.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1
  country_code_picker: ^3.0.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.17.1
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.7
  flutter_bloc: ^9.1.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  equatable: ^2.0.8
  dartz: ^0.10.1
  firebase_messaging: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/splash_logo.png"
